interface:
  display_name: "Email Model Editor"
  short_description: "Edit Stripo emails through native JSON models"
  default_prompt: "Use $email-model-editor to make the requested Stripo edit through a validated SDK mutation and the required uploads. For a focused operation, finish on set_document_state status=OK. Use the normal verification workflow for broader changes or requested checks."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "stripo-mcp"
      description: "Stripo MCP server for emails, templates, image generation/editing and business profiles. The plugin bundles its configuration; authorize it in your agent. See the plugin README."
