interface:
  display_name: "Email From Reference"
  short_description: "Create Stripo emails from text or other references"
  default_prompt: "Use $email-from-reference to create a Stripo email. For an email with no requested changes inside it, finish after create_email succeeds with editorModelReady=true. For content creation, draft the reference when needed, build, persist, and verify the saved model and desktop/mobile PNGs."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "stripo-mcp"
      description: "Stripo MCP server for emails, templates, image generation/editing and business profiles. The plugin bundles its configuration; authorize it in your agent. See the plugin README."
