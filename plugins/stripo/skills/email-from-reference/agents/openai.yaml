interface:
  display_name: "Email From Reference"
  short_description: "Create Stripo emails from text or other references"
  default_prompt: "Use $email-from-reference to create and persist a Stripo email as native editable JSON. Default to Creative; when no reference is supplied, first author a text reference with the proposed structure and copy using the user's goal and verified brand context. Then build and verify the saved model and desktop/mobile PNGs."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "stripo-mcp"
      description: "Stripo MCP server for emails, templates, image generation/editing and business profiles. Configure and authorize it in your agent using your organization's OAuth client ID; see the plugin README."
