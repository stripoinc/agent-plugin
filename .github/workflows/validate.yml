name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.18.1, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install maintenance dependencies
        run: npm ci --ignore-scripts
      - name: Validate generated metadata, package files and isolated SDK
        run: npm run validate
      - name: Test generation and release guards
        run: npm test
      - name: Validate with the pinned Claude CLI
        if: matrix.node == 22
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.281
          npm run validate:claude
      - name: Require a higher plugin version for distribution changes
        if: github.event_name == 'pull_request' && matrix.node == 22
        env:
          PLUGIN_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:version
